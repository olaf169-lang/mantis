name: Publikacja na GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publikuj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Włącz i skonfiguruj Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Spakuj katalog gry
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wdróż na Pages
        id: deploy
        uses: actions/deploy-pages@v4

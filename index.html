<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#8fce8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikony/icon-192.png">
<link rel="icon" href="ikony/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MANTIS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #6cb673; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #gra { display: block; touch-action: none; }

  /* --- ekran domowy --- */
  #dom {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 12px) + 12px) 16px calc(env(safe-area-inset-bottom, 12px) + 16px);
    background:
      radial-gradient(120% 60% at 75% 0%, rgba(255,251,205,0.95), rgba(255,246,180,0) 60%),
      linear-gradient(180deg, #eaf7cf 0%, #b6e0a0 55%, #6cb673 100%);
  }
  #dom.ukryty { display: none; }
  #dom { overflow-x: hidden; }
  #tytul { font-size: 40px; font-weight: 800; color: #3d5c1e; letter-spacing: .06em; margin-top: 48px; }
  #domModliszka { display: block; width: 240px; height: 150px; }
  #naglowekWyboru { font-size: 15px; font-weight: 700; color: #6a7d4a; letter-spacing: .08em; margin: 2px 0 10px; }
  #karty { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 440px; }
  .karta {
    min-width: 0; background: rgba(255,255,255,0.55); border: 3px solid transparent;
    border-radius: 18px; padding: 8px 6px 10px; text-align: center; position: relative;
    transition: transform .12s, border-color .12s, background .2s;
  }
  .karta.wybrana { border-color: #6e9a33; background: rgba(255,255,255,0.85); transform: translateY(-3px); }
  .karta.zablokowana { opacity: .96; }
  .karta canvas { display: block; width: 100%; max-width: 100%; height: 84px; }
  .karta .nazwa { font-size: 13px; font-weight: 700; color: #3d5c1e; margin-top: 2px; line-height: 1.15; }
  .karta .lac { font-size: 10px; font-style: italic; color: #7a8a5c; }
  .karta .klodka { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 34px; }
  .karta .odznaka { position: absolute; top: 6px; right: 8px; font-size: 16px; }
  #graj {
    margin-top: auto; margin-bottom: 4px; border: 0; border-radius: 22px;
    background: linear-gradient(180deg, #7fb63f, #5d8a2a); color: #fff;
    font-size: 26px; font-weight: 800; letter-spacing: .06em;
    padding: 16px 64px; box-shadow: 0 6px 0 #4a6e22, 0 10px 20px rgba(60,80,30,.35);
  }
  #graj:active { transform: translateY(3px); box-shadow: 0 3px 0 #4a6e22, 0 6px 12px rgba(60,80,30,.35); }
  #najnowsza { margin-top: 10px; border: 0; background: transparent;
    color: #5a6d3a; font-size: 13px; font-weight: 600; text-decoration: underline; padding: 6px; }
  #resetTekst { margin-top: 2px; margin-bottom: 2px; border: 0; background: transparent;
    color: #a35; font-size: 13px; font-weight: 600; text-decoration: underline; padding: 6px; }

  /* --- przyciski w rogu --- */
  .rogPrzycisk {
    position: fixed; z-index: 24; border: 0; border-radius: 50%;
    width: 38px; height: 38px; font-size: 18px;
    background: rgba(255,255,255,0.7); color: #3d5c1e;
    display: flex; align-items: center; justify-content: center;
  }
  #dzwiek { top: calc(env(safe-area-inset-top, 10px) + 8px); right: calc(env(safe-area-inset-right, 10px) + 10px); }
  #album { top: calc(env(safe-area-inset-top, 10px) + 8px); left: calc(env(safe-area-inset-left, 10px) + 10px); }
  #reset { top: calc(env(safe-area-inset-top, 10px) + 8px); left: calc(env(safe-area-inset-left, 10px) + 66px); }
  #doDomu { top: calc(env(safe-area-inset-top, 10px) + 8px); left: calc(env(safe-area-inset-left, 10px) + 10px); display: none; }

  /* --- album ciekawostek --- */
  #albumEkran {
    position: fixed; inset: 0; z-index: 25; display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 12px) + 12px) 14px calc(env(safe-area-inset-bottom, 12px) + 14px);
    background: linear-gradient(180deg, #eef4dc 0%, #cfe4b4 100%); overflow-y: auto;
  }
  #albumEkran.pokaz { display: flex; }
  #albumEkran h2 { text-align: center; color: #3d5c1e; font-size: 24px; margin-bottom: 4px; }
  #albumEkran .licznik { text-align: center; color: #6a7d4a; font-size: 13px; margin-bottom: 12px; }
  #albumSiatka { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .albKarta { background: rgba(255,255,255,0.6); border-radius: 14px; padding: 6px; text-align: center; }
  .albKarta canvas { width: 100%; height: 74px; display: block; }
  .albKarta .t { font-size: 11px; font-weight: 700; color: #3d5c1e; line-height: 1.1; margin-top: 3px; }
  #albumZamknij {
    position: fixed; top: calc(env(safe-area-inset-top, 10px) + 8px); right: calc(env(safe-area-inset-right, 10px) + 10px);
    z-index: 26; border: 0; border-radius: 50%; width: 46px; height: 46px; font-size: 22px;
    background: rgba(255,255,255,0.8); color: #3d5c1e; display: none;
  }
  #albumZamknij.pokaz { display: flex; align-items: center; justify-content: center; }
  /* okno z opisem karty */
  #kartaOpis {
    position: fixed; inset: 0; z-index: 27; display: none; align-items: center; justify-content: center;
    background: rgba(20,30,15,0.5); padding: 24px;
  }
  #kartaOpis.pokaz { display: flex; }
  #kartaOpis .karta { background: #fbfdf3; border-radius: 20px; padding: 18px; max-width: 340px; text-align: center; }
  #kartaOpis canvas { width: 180px; height: 130px; }
  #kartaOpis .t { font-size: 20px; font-weight: 800; color: #3d5c1e; margin-top: 6px; }
  #kartaOpis .lac { font-size: 13px; font-style: italic; color: #7a8a5c; }
  #kartaOpis .f { font-size: 15px; color: #45532f; margin-top: 10px; line-height: 1.4; }

  /* listek-powiadomienie o nowej karcie (w grze, nie zatrzymuje gry) */
  #listek {
    position: fixed; z-index: 16; left: 50%; transform: translateX(-50%) translateY(-80px);
    top: calc(env(safe-area-inset-top, 10px) + 60px);
    background: rgba(255,255,255,0.92); color: #3d5c1e; font-weight: 700; font-size: 14px;
    padding: 8px 16px 8px 12px; border-radius: 20px; box-shadow: 0 4px 12px rgba(60,80,30,.3);
    opacity: 0; transition: transform .4s, opacity .4s; pointer-events: none;
  }
  #listek.pokaz { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* domek pulsuje po epilogu, żeby było wiadomo, że to koniec */
  @keyframes pulsHome {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,210,60,0.7); }
    50% { transform: scale(1.12); box-shadow: 0 0 0 12px rgba(255,210,60,0); }
  }
  #doDomu.pulsuje { background: #ffd23f; animation: pulsHome 1.1s ease-in-out infinite; }

  /* okno potwierdzenia wyczyszczenia */
  #potwierdz {
    position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    background: rgba(20,30,15,0.55); padding: 24px;
  }
  #potwierdz.pokaz { display: flex; }
  #potwierdz .okno { background: #fbfdf3; border-radius: 20px; padding: 22px; max-width: 320px; text-align: center; }
  #potwierdz .okno p { color: #3d5c1e; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  #potwierdz .okno small { color: #7a8a5c; font-size: 13px; display: block; margin-bottom: 16px; }
  #potwierdz .rzad { display: flex; gap: 10px; }
  #potwierdz button { flex: 1; border: 0; border-radius: 14px; padding: 13px; font-size: 16px; font-weight: 700; }
  #potwierdzNie { background: #dfe7d0; color: #3d5c1e; }
  #potwierdzTak { background: #d9534f; color: #fff; }
</style>
</head>
<body>
<canvas id="gra"></canvas>

<button id="dzwiek" class="rogPrzycisk" aria-label="dźwięk">🔊</button>
<button id="album" class="rogPrzycisk" aria-label="album">📖</button>
<button id="reset" class="rogPrzycisk" aria-label="wyczyść">🗑️</button>
<button id="doDomu" class="rogPrzycisk" aria-label="dom">🏠</button>

<div id="dom">
  <div id="tytul">MANTIS</div>
  <canvas id="domModliszka" width="480" height="300"></canvas>
  <div id="naglowekWyboru">WYBIERZ MODLISZKĘ</div>
  <div id="karty"></div>
  <button id="graj">GRAJ</button>
  <button id="najnowsza" onclick="mantisNajnowsza()">♻️ Pobierz najnowszą wersję</button>
  <button id="resetTekst">🗑️ Wyczyść postęp</button>
</div>

<div id="albumEkran">
  <h2>Album ciekawostek</h2>
  <div class="licznik" id="albumLicznik"></div>
  <div id="albumSiatka"></div>
</div>
<button id="albumZamknij" aria-label="zamknij">✕</button>
<div id="kartaOpis"><div class="karta" id="kartaOpisTresc"></div></div>

<div id="listek">🍃 nowa karta</div>

<div id="potwierdz">
  <div class="okno">
    <p>Wyczyścić cały postęp?</p>
    <small>Znikną odblokowane modliszki, światy i karty. Zostanie tylko pierwsza modliszka.</small>
    <div class="rzad">
      <button id="potwierdzNie">Nie</button>
      <button id="potwierdzTak">Tak, wyczyść</button>
    </div>
  </div>
</div>

<script src="silnik/modliszka.js"></script>
<script src="silnik/swiat.js"></script>
<script src="silnik/owad.js"></script>
<script src="silnik/zapis.js"></script>
<script src="silnik/dzwiek.js"></script>
<script src="silnik/album.js"></script>
<script src="silnik/gra.js"></script>
<script src="silnik/menu.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    let odswiezono = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (odswiezono) return; odswiezono = true; location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
    });
  }
  /* przycisk „najnowsza wersja": czyści pamięć i service workera, przeładowuje */
  async function mantisNajnowsza() {
    try {
      if ('caches' in window) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
      if ('serviceWorker' in navigator) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); }
    } catch (e) {}
    location.reload();
  }
</script>
</body>
</html>
